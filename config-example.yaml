global:
    location:
      latitude: 60.4518
      longitude: 22.2666
    timezone: Europe/Helsinki
mqtt:
  server: localhost
  port: 1883

  # Target definitions: Map friendly aliases to MQTT topic(s).
  topics:
    # Individual Thermostats (writeable)
    thermostat.bathroom:
      - "zwave/thermostat-bathroom/67/0/setpoint/1/set"
    thermostat.livingroom:
      - "zwave/thermostat-livingroom/67/0/setpoint/1/set"
    thermostat.kitchen:
      - "zwave/thermostat-kitchen/67/0/setpoint/1/set"
    thermostat.hall:
      - "zwave/thermostat-hall/67/1/setpoint/1/set"
    thermostat.toilet:
      - "zwave/thermostat-toilet/67/1/setpoint/1/set"
    thermostat.office:
      - "zwave/thermostat-office/67/1/setpoint/1/set"

    # Thermostat Groups (writeable)
    thermostat.all_zones:
      - "zwave/thermostat-bathroom/67/0/setpoint/1/set"
      - "zwave/thermostat-livingroom/67/0/setpoint/1/set"
      - "zwave/thermostat-kitchen/67/0/setpoint/1/set"
      - "zwave/thermostat-hall/67/1/setpoint/1/set"
      - "zwave/thermostat-toilet/67/1/setpoint/1/set"
      - "zwave/thermostat-office/67/1/setpoint/1/set"

    # Lights (writeable)
    light.outdoor:
      - "zigbee2mqtt/light-outdoor/set"

    # Sensors (read-only)
    outside_temperature:
      - "temperature/outdoor"
    total_energy_consumption:
      - "energy/total_consumption"

    # Synthetic MQTT Topics (read-only)
    electricity_price:
      - "energy/current_price"

tasks:
  - type: rules-engine
    config:
      rules_file: rules-example.yaml
      reset_interval: 30m
