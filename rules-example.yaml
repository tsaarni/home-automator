
rules:
  # Direct setpoint (simple): Set heater to 22C at 07:00 every weekday morning
  - id: "morn_heat_direct"
    name: "Weekday morning direct setpoint"
    priority: 100
    enabled: true
    trigger:
      type: time
      schedule:
        at: "05:00"
        days: [Mon, Tue, Wed, Thu, Fri]
    actions:
      - type: setpoint
        target: "thermostat.bathroom"
        value: 22
    metadata:
      description: "Set bathroom to 22 deg on weekdays morning"

  # Interpolated curve: set heating based on outside temperature
  - id: "curve_outside_temp"
    name: "Heating curve based on outside temperature"
    priority: 80
    enabled: true
    trigger:
      type: mqtt
      name: "outside_temperature"
    actions:
      - type: set_curve
        target: "thermostat.bathroom"
        curve:
          x: "outside_temperature"
          points:
            - [-20, 25]
            - [-5, 23]
            - [0, 21]
            - [10, 19]
            - [20, 17]
    metadata:
      description: "Adjust heating setpoint based on outside temperature using linear interpolation"

  # Energy constraint: reduce heat when total energy consumption is above a threshold
  - id: "energy_limit_reduce"
    name: "Reduce heating when energy consumption high"
    priority: 200
    enabled: true
    trigger:
      type: mqtt
      name: "total_energy_consumption"
    conditions:
      all:
        - topic: "total_energy_consumption"
          operator: "gt"
          value: "15000W"
    actions:
      - type: setpoint
        target: "thermostat.livingroom"
        value: 10
    metadata:
      description: "Turn down heat if total home consumption exceeds 15kW"

  # Electricity price condition: if price gets too high, reduce setpoint across zones
  - id: "price_spike_shed"
    name: "Shed heating on expensive electricity"
    priority: 150
    enabled: true
    trigger:
      type: mqtt
      name: "electricity_price"
    conditions:
      all:
        - topic: "electricity_price"
          operator: "gt"
          value: 0.25  # currency units / kWh
    actions:
      - type: setpoint
        target: "thermostat.all_zones"
        value: 16
    metadata:
      description: "Shed heating to 16C across zones when price spikes > 0.25"


  # Manual setpoint with timeout: user sets the bathroom manually; after 4 hours, a setback is applied
  - id: "bathroom_manual_setback"
    name: "Bathroom manual setpoint with 4-hour setback"
    priority: 120
    enabled: true
    trigger:
      type: mqtt
      name: "thermostat.bathroom"
    conditions:
      all:
        - topic: "thermostat.bathroom"
          operator: "ne"
          value: 16
    actions:
      - type: setpoint
        target: "thermostat.bathroom"
        value: 16
        execute_after: "4h"
    metadata:
      description: "Allow manual setpoint in bathroom; after 4 hours lower to 16C"

  # Set outdoor lights based on dusk/sunrise times
  - id: "outdoor_lights_dusk"
    name: "Outdoor lights on at dusk, off at sunrise"
    priority: 50
    enabled: true
    trigger:
      type: time
      schedule:
        at: dusk
    actions:
      - type: switch
        target: "light.outdoor"
        state: "ON"
  - id: "outdoor_lights_sunrise"
    name: "Outdoor lights off at sunrise"
    priority: 50
    enabled: true
    trigger:
      type: time
      schedule:
        at: sunrise
    actions:
      - type: switch
        target: "light.outdoor"
        state: "OFF"
